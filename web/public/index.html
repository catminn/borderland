<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>百鬼夜行 控制台</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
<script src="ghost-ambience.js" defer></script>
</head>
<body>
<div id="amb" aria-hidden="true"></div>
<div class="wrap">
  <header class="top" id="top">
    <span class="logo" id="logo">百鬼夜行</span>
    <span class="tag" id="who"></span>
    <span class="top-r">
      <span class="pill" id="conn" hidden>连接中…</span>
      <span class="clk" aria-label="游戏时钟"><i class="gd" id="clkdot"></i><span id="clk">T+00:00</span></span>
      <button class="tbtn" id="clockctl" data-a="clockctl" hidden>开始计时</button>
      <button class="tbtn" id="theme" data-a="theme" hidden aria-label="切换深浅色">深色</button>
      <select class="tbtn devas" id="devas" hidden aria-label="开发者：选择查看谁的页面"></select>
      <button class="tbtn devops" id="devops" data-a="devops" hidden aria-pressed="false">只读</button>
      <button class="tbtn" id="logout" data-a="logout" hidden>退出</button>
    </span>
  </header>
  <nav class="pages" role="tablist" id="tabs" hidden></nav>
  <div class="notice" id="notice" role="status"></div>
  <main id="view"></main>
</div>
<div id="modal"></div>
<script type="module" src="app.js"></script>
</body>
</html>
